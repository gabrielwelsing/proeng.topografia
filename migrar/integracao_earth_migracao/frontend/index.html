<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend - Migração Módulo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #1a73e8;
        }

        .control-panel {
            margin: 20px 0;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 20px;
            background-color: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #1557b0;
        }

        .console-output {
            background-color: #1e1e1e;
            color: #0f0;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Conexão com API (Backend)</h1>
        <p>Este arquivo de frontend está configurado para consumir o backend isolado do Railway.</p>

        <div class="control-panel">
            <button id="btnPing">1. Testar Conexão (GET)</button>
            <button id="btnPost">2. Salvar Dados (POST)</button>
        </div>

        <h3>Log do Sistema:</h3>
        <div class="console-output" id="logBox">Pronto para iniciar comunicações...</div>
    </div>

    <!-- Referência ao script JS onde a configuração da API e funções residem -->
    <script src="app.js"></script>
</body>

</html>
